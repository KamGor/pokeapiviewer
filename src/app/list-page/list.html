<nav class="submenu flex pt-4">
  <a
    class="text-black font-bold text-xl px-4 py-2 rounded-t-lg border border-solid border-black border-b-0 bg-white"
    routerLink="berries"
    routerLinkActive="active"
    >Berries</a
  >
  <a
    class="text-black font-bold text-xl px-4 py-2 rounded-t-lg border border-solid border-black border-b-0 bg-white"
    routerLink="locations"
    routerLinkActive="active"
    >Locations</a
  >
</nav>
<div class="content px-2 py-4 bg-white rounded-lg rounded-tl-none border border-solid border-black">
  @if(isList) {
  <div class="border-2 rounded-md w-56 ml-0 bg-yellow-300 :first-letter-text-transform: capitalize">
    <ul>
      Pokedex List: @if (listPokemons) { @for (pokemon of listPokemons; track $index) {
      <li>
        <a
          class="cursor-progress text-cyan-500 animate-pulse"
          (click)="navigateDetails(pokemon.name)"
          >Pokemon:{{ pokemon.name }}</a
        >
      </li>
      } }
    </ul>
    <div class="inline-flex gap-3">
      <button
        [disabled]="isPrevDisabled"
        (click)="paginationHandler('prev')"
        class="bg-green-400 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l"
      >
        Prev
      </button>
      <p class="mt-2 animate-ping"><====></p>
      <button
        [disabled]="isNextDisabled"
        (click)="paginationHandler('next')"
        class="bg-green-500 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-r"
      >
        Next
      </button>
    </div>
  </div>
  }
  <router-outlet></router-outlet>
</div>
